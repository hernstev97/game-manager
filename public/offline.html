<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#65558f" />
    <title>gGrid ist offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fdf7ff; color: #1d1b20; }
      main { width: min(32rem, calc(100% - 3rem)); padding: 2rem; border-radius: 1.5rem; background: #ece6ee; box-shadow: 0 8px 24px #0002; }
      h1 { margin-top: 0; font-size: clamp(1.6rem, 6vw, 2.4rem); }
      p { line-height: 1.55; }
      a { display: inline-flex; min-height: 2.75rem; align-items: center; margin-top: 0.5rem; padding: 0 1.25rem; border-radius: 999px; color: #fff; background: #65558f; font-weight: 700; text-decoration: none; }
      @media (prefers-color-scheme: dark) { body { color: #e8e0e9; background: #151217; } main { background: #302d32; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Gerade keine Verbindung</h1>
      <p>gGrid konnte diese Ansicht noch nicht lokal speichern. Bereits geladene Bibliotheksdaten sind nach dem Öffnen der App weiterhin verfügbar.</p>
      <a href="/">Erneut versuchen</a>
    </main>
  </body>
</html>
